name: CI

on:
  push:
    branches: [main, claude/nice-goodall-msc6fx]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run lab -- doctor fixtures/site
      - name: Dry loop on a known-good patch
        run: npm run lab -- run --dry fixtures/site --experiment fixtures/good/nav-docs --ledger "$RUNNER_TEMP/ledger.jsonl" --evidence "$RUNNER_TEMP/evidence"
      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore

  nextjs:
    name: Next.js examples (static export loop, server proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nextjs/package-lock.json
            examples/nextjs-proxy/package-lock.json
      - run: npm ci
      - run: npm ci --prefix examples/nextjs
      - run: npm ci --prefix examples/nextjs-proxy
      - run: npx playwright install --with-deps chromium
      - run: npm run lab -- doctor examples/nextjs
      - run: npm run test:nextjs

  action:
    name: GitHub Action, dry run on the fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: doctor
        uses: ./
        with:
          site: fixtures/site
          command: doctor
      - name: run --dry, replaying a known-good patch
        id: run
        uses: ./
        with:
          site: fixtures/site
          command: run
          dry: 'true'
          replay: fixtures/good/nav-docs
          commit: 'false'
      - name: The dry run passed Verify
        env:
          CODE: ${{ steps.run.outputs.exit-code }}
        run: test "$CODE" = 0
      - name: run --dry, replaying a breakage
        id: breakage
        uses: ./
        with:
          site: fixtures/site
          command: run
          dry: 'true'
          replay: fixtures/breakages/changed-price
          commit: 'false'
      - name: The breakage was rejected
        env:
          CODE: ${{ steps.breakage.outputs.exit-code }}
        run: test "$CODE" = 1
