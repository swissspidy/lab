name: CI

on:
  push:
    branches: [main, claude/nice-goodall-msc6fx]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run lab -- doctor fixtures/site
      - name: Dry loop on a known-good patch
        run: npm run lab -- run --dry fixtures/site --experiment fixtures/good/nav-docs --ledger "$RUNNER_TEMP/ledger.jsonl" --evidence "$RUNNER_TEMP/evidence"
      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore

  nextjs:
    name: Next.js example, full loop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nextjs/package-lock.json
      - run: npm ci
      - run: npm ci --prefix examples/nextjs
      - run: npx playwright install --with-deps chromium
      - run: npm run lab -- doctor examples/nextjs
      - run: npm run test:nextjs
