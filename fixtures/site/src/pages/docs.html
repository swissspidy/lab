	<h1>Documentation</h1>
	<h2 id="quick-start">Quick start</h2>
	<p>Build your site, then run Kestrel on the output directory:</p>
	<pre><code>npx kestrel-links dist/</code></pre>
	<h2 id="configuration">Configuration</h2>
	<p>Put options in <code>kestrel.json</code> next to your <code>package.json</code>.</p>
	<h2 id="ci">Running in CI</h2>
	<p>Kestrel exits with code 1 when it finds a broken link, so any CI system fails the job.</p>
